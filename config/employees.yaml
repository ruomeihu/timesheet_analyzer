# ============================================
# 员工配置文件
# ============================================
# 修改说明：
# - name_cn: 中文名（用于报告显示）
# - name_en: 英文名（必须与 Notion 中的成员名称一致）
# - type: 全职 / 兼职 / 按需
# - standard_hours: 周标准工时（按需员工可设为 null）
# - department: 部门
# - position: 职位名称
# - responsibilities: 岗位职责列表
# - leaves: 请假记录（可选）
# - offboard_date: 离职生效日（可选），该日所属 ISO 周及之后周报中完全不出现
# ============================================

# 部门信息
department:
  name: "数据平台部"
  responsibilities: "负责医疗健康数据的采集、清洗、标准化处理，建立可复用的数据处理流程和规范体系；建设并维护公司内部数据基础设施，包括数据仓库、数据中台及相关服务的部署与运维；推进 AI 基础设施的搭建，包括大模型 API 接入、向量数据库、模型推理环境等底层能力建设；承接对外数据类项目中涉及数据工程的部分，包括数据提取、结构化处理、指标计算及数据交付；制定并维护数据资产管理规范，推动数据质量标准化，支撑公司数据资产化进程；负责医疗健康行业数据的研究与分析，包括行业周报交付、企业研究及政府数据类项目的数据支撑"

# 默认配置
defaults:
  full_time_hours: 40      # 全职周标准工时
  part_time_hours: 24      # 兼职周标准工时
  daily_hours: 8           # 日标准工时

  # 工时达成率阈值
  thresholds:
    overload: 1.2          # 超过 120% 视为超负荷
    underload: 0.7         # 低于 70% 视为负荷偏低

  # AI 分析配置
  ai_analysis:
    enabled: true
    model: "claude-sonnet-4-6"
    max_tokens: 16384   # Sonnet 4.6 输出比 Sonnet 4 详细约 3 倍，8192 会截断导致 JSON 不完整
    temperature: 0.3
    effort: "medium"    # 4.6 默认 effort=high 篇幅过长，medium 收敛篇幅 + 降本提速

# 项目分类参考（辅助 AI 分析）
project_categories:
  strategic:  # 战略项目
    keywords:
      - "战略"
      - "重点"
      - "核心"
      - "新业务"
      - "产品研发"
  operational:  # 维持性事务
    keywords:
      - "日常运营"
      - "行政管理"
      - "团队管理"
      - "例行"
  support:  # 支持工作
    keywords:
      - "跨部门"
      - "支持"
      - "协助"

