name: Dingtalk Friday Report Push

# 定时推送已并入 weekly_report.yml 的 push job（周报生成后立即推送，跟随本周最后工作日）。
# 本 workflow 仅保留手动触发，用于排查后重发本周推送。
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests python-dotenv

      - name: Push timesheet report to Dingtalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python dingtalk_report_push.py
