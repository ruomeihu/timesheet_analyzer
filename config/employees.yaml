# ============================================
# 员工配置文件
# ============================================
# 修改说明：
# - name_cn: 中文名（用于报告显示）
# - name_en: 英文名（必须与 Notion 中的成员名称一致）
# - type: 全职 / 兼职 / 按需
# - standard_hours: 周标准工时（按需员工可设为 null）
# - department: 部门
# - position: 职位名称
# - responsibilities: 岗位职责列表
# - leaves: 请假记录（可选）
# ============================================

# 部门信息
department:
  name: "合作发展部"
  responsibilities: "研究院的行政运营、销售支持、战略事宜和一部分项目的交付"

# 默认配置
defaults:
  full_time_hours: 40      # 全职周标准工时
  part_time_hours: 24      # 兼职周标准工时
  daily_hours: 8           # 日标准工时

  # 工时达成率阈值
  thresholds:
    overload: 1.2          # 超过 120% 视为超负荷
    underload: 0.7         # 低于 70% 视为负荷偏低

  # AI 分析配置
  ai_analysis:
    enabled: true
    model: "claude-sonnet-4-20250514"
    max_tokens: 8192
    temperature: 0.3

# 项目分类参考（辅助 AI 分析）
project_categories:
  strategic:  # 战略项目
    keywords:
      - "战略"
      - "重点"
      - "核心"
      - "新业务"
      - "产品研发"
  operational:  # 维持性事务
    keywords:
      - "日常运营"
      - "行政管理"
      - "团队管理"
      - "例行"
  support:  # 支持工作
    keywords:
      - "跨部门"
      - "支持"
      - "协助"

