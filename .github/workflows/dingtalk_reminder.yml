name: Dingtalk Friday Reminder

on:
  schedule:
    - cron: '0 0 * * 5'  # UTC 00:00 = 北京时间 08:00 周五（提前 1h 抵消 GitHub schedule 延迟，使提醒在 9:00 前送达）
  workflow_dispatch:       # 支持手动触发

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests python-dotenv

      - name: Send Dingtalk reminder
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python dingtalk_reminder.py
